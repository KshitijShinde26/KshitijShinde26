    <svg width="330" height="8">
      <rect width="100%" height="8" rx="4" fill="#24283b"/>
      <g clip-path="url(#bar-clip)">
        <rect x="0%" y="0" width="65.7%" height="8" fill="#b07219"/><rect x="65.7%" y="0" width="27.1%" height="8" fill="#da5b0b"/><rect x="92.80000000000001%" y="0" width="6.9%" height="8" fill="#3178c6"/><rect x="99.70000000000002%" y="0" width="0.2%" height="8" fill="#7aa2f7"/>
      </g>
      <clipPath id="bar-clip"><rect width="100%" height="8" rx="4"/></clipPath>
    </svg>
  </g>
  
  
      <circle cx="25" cy="86" r="5" fill="#b07219"/>
